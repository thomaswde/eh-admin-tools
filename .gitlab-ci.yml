stages:
  - test
  - package

javascript:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm run check

python:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install --disable-pip-version-check -r requirements-dev.txt
    - python -m pytest -q
    - ruff check main.py backend tests

distribution:
  stage: package
  image: python:3.12-slim
  needs: [javascript, python]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - python scripts/build_dist.py
  artifacts:
    expire_in: 14 days
    paths:
      - dist/*.zip
      - dist/*.sha256

